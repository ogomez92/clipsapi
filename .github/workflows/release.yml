name: Release

# Push a tag like v1.0.0 (it must match installer/Cargo.toml's version) to build
# the DLLs and the installer on GitHub and attach them to a release of that tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and release, e.g. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    # VS 2022 (toolset v143, like the project). windows-latest's VS 2026 image has no ATL.
    runs-on: windows-2022
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Check the tag matches the installer version
        shell: pwsh
        run: |
          $version = (Select-String -Path installer/Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG does not match installer/Cargo.toml version $version" }

      - uses: microsoft/setup-msbuild@v2

      - name: Make sure Visual Studio has ATL
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vs = & "$installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (Get-ChildItem "$vs\VC\Tools\MSVC\*\atlmfc\include\atlbase.h" -ErrorAction SilentlyContinue) { Write-Host "ATL present in $vs"; exit 0 }
          Write-Host "Installing ATL into $vs"
          $p = Start-Process "$installer\vs_installer.exe" -Wait -PassThru -ArgumentList "modify --installPath `"$vs`" --add Microsoft.VisualStudio.Component.VC.ATL --quiet --norestart --nocache"
          if (-not (Get-ChildItem "$vs\VC\Tools\MSVC\*\atlmfc\include\atlbase.h" -ErrorAction SilentlyContinue)) { throw "ATL install failed (exit $($p.ExitCode))" }

      - name: Build the voice DLLs (x64 and x86)
        shell: pwsh
        run: |
          msbuild ClipboardVoice/ClipboardVoice.sln /t:Rebuild /p:Configuration=Release /p:Platform=x64 /m /nologo /v:minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          msbuild ClipboardVoice/ClipboardVoice.sln /t:Rebuild /p:Configuration=Release /p:Platform=Win32 /m /nologo /v:minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # wxdragon builds wxWidgets with CMake and Ninja.
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer

      - name: Build the installer
        working-directory: installer
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          # Same layout as the repo, so scripts\install.bat finds the DLLs after unzipping.
          New-Item -ItemType Directory -Force dist, pkg/ClipboardVoice/x64/Release, pkg/ClipboardVoice/x86/Release, pkg/scripts, pkg/test, pkg/vendor | Out-Null
          Copy-Item installer/target/release/ClipboardVoiceInstaller.exe dist/
          Copy-Item ClipboardVoice/x64/Release/ClipboardVoice.dll pkg/ClipboardVoice/x64/Release/
          Copy-Item ClipboardVoice/x86/Release/ClipboardVoice.dll pkg/ClipboardVoice/x86/Release/
          # prism.dll (both architectures) and its licences, for the Sapi2Prism voices.
          Copy-Item -Recurse vendor/prism pkg/vendor/
          Copy-Item scripts/* pkg/scripts/
          Copy-Item test/say.ps1 pkg/test/
          Copy-Item README.md pkg/
          Compress-Archive -Path pkg/* -DestinationPath "dist/ClipboardVoice-$env:TAG-dlls.zip"
          # LF line endings so `sha256sum -c SHA256SUMS.txt` works everywhere.
          $sums = Get-FileHash dist/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path -Leaf $_.Path)`n" }
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", -join $sums)

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG (Get-ChildItem dist/*).FullName --clobber
          } else {
            gh release create $env:TAG (Get-ChildItem dist/*).FullName --title "Clipboard Voice $env:TAG" --generate-notes
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
