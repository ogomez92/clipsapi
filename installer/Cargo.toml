[package]
name = "clipboard-voice-installer"
version = "1.1.0"
edition = "2021"
description = "Installer for Clipboard Voice, the SAPI 5 voice that writes speech to the clipboard"

[[bin]]
name = "ClipboardVoiceInstaller"
path = "src/main.rs"

[dependencies]
wxdragon = "0.9"
winreg = "0.55"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_Globalization"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
